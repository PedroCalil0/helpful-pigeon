<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕊️ Helpful Pigeon — Proxy Local</title>
<style>
  /* ... (mantém todo o CSS que já tens, sem alterações) ... */
</style>
</head>
<body>
<div class="app">
  <!-- ... (mantém todo o HTML que já tens, sem alterações) ... -->
</div>

<script>
(function(){
  "use strict";

  /* --- PROXY --- */
  const DEFAULT_PROXY = "/proxy?token=meu-segredo-super-longo&url={url}";
  const STORAGE_KEY = "helpful-pigeon-proxy-url";
  let proxyTemplate = localStorage.getItem(STORAGE_KEY) || DEFAULT_PROXY;

  function buildProxyUrl(targetUrl){
    const encoded = encodeURIComponent(targetUrl);
    if (proxyTemplate.indexOf("{url}") !== -1){
      return proxyTemplate.replace(/\{url\}/g, encoded);
    }
    return proxyTemplate + encoded;
  }
  function maskProxy(url){
    return url.replace(/token=([^&]+)/, (m, t) =>
      "token=" + (t.length > 8 ? t.slice(0,4) + "…" + t.slice(-3) : "***"));
  }

  /* ... (mantém o resto das funções e variáveis iguais) ... */

  /* =========================================================
     CARREGAMENTO — sempre via srcdoc
     ========================================================= */
  async function loadViaSrcdoc(targetUrl, finalUrl){
    try {
      const ctl = new AbortController();
      const tid = setTimeout(() => ctl.abort(), 20000);
      const res = await fetch(finalUrl, { signal: ctl.signal, mode: "cors" });
      clearTimeout(tid);

      if (!res.ok){
        if (res.status === 401 || res.status === 403){
          showError(targetUrl, "O proxy devolveu HTTP " + res.status + ".", "🔐");
          return;
        }
        throw new Error("HTTP " + res.status);
      }

      // ▼▼▼ ALTERAÇÃO AQUI ▼▼▼
      // Lê o URL final que o proxy devolveu (já depois dos redirects)
      const finalUrlAfterRedirect = res.headers.get("X-Final-URL") || targetUrl;
      // ▲▲▲ ALTERAÇÃO AQUI ▲▲▲

      let html = await res.text();
      const low = html.slice(0, 400).toLowerCase();
      if (low.indexOf("token inválido") !== -1 || low.indexOf("invalid token") !== -1){
        showError(targetUrl, "O proxy rejeitou o token.", "🔐");
        return;
      }

      // Usa o URL final para o <base> e para atualizar a barra
      html = rewriteHTML(html, finalUrlAfterRedirect);

      view.removeAttribute("src");
      view.srcdoc = html;
      showPane("view");

      // Atualiza a barra de endereços para o URL final
      address.value = finalUrlAfterRedirect;
      state.current = finalUrlAfterRedirect;

      if (globalLoadTimer){ clearTimeout(globalLoadTimer); globalLoadTimer = null; }
      setStatus("Carregado — " + hostOf(finalUrlAfterRedirect), "ok");
      setStats("srcdoc · " + maskProxy(finalUrlAfterRedirect));
      showProgress(false);
      state.busy = false;

    } catch(err){
      if (err.name === "AbortError"){
        showError(targetUrl, "Timeout ao buscar o HTML do proxy.", "⏱️");
        return;
      }
      showError(targetUrl, err.message || String(err), "⚠️");
    }
  }

  /* ... (mantém todo o resto do código igual ao que já tens) ... */

})();
</script>
</body>
</html>
